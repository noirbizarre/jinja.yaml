[project]
name = "jinja.yaml"
version = "0.1.0"
description = "YAML configuration with dependency-aware Jinja templating"
authors = [
    { name = "Axel H.", email = "noirbizarre@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
]
readme = "README.md"
license = "MIT"
keywords = ["yaml", "jinja", "jinja2", "configuration", "templating"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/noirbizarre/jinja.yaml"
Repository = "https://github.com/noirbizarre/jinja.yaml"
Issues = "https://github.com/noirbizarre/jinja.yaml/issues"


[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jinja_yaml"
module-root = "src"


[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "doc" },
]
test = [
    "pytest>=9.0",
    "pytest-cov>=5.0",
]
lint = [
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "prek",
]
doc = [
    "emotional>=0.4",
]


[tool.ruff]
line-length = 100
respect-gitignore = true
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # mccabe / comprehensions
    "C",
    # Pyupgrade
    "UP",
    # isort
    "I001",
]

[tool.ruff.lint.isort]
known-first-party = ["jinja_yaml"]
lines-between-types = 1


[tool.ty.rules]
# ty is pre-1.0; keep configuration minimal and rely on sensible defaults.


[tool.pytest]
addopts = ["-ra"]
testpaths = ["tests"]


[tool.coverage.run]
source = ["jinja_yaml"]
branch = true
omit = ["tests/*"]
relative_files = true

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if TYPE_CHECKING:",
    "@overload",
]


[tool.commitizen]
name = "emotional"
github = "noirbizarre/jinja.yaml"
version_provider = "pep621"
major_version_zero = true
breaking_change_exclamation_in_title = true
allowed_prefixes = ["Merge", "Revert", "Pull request", "fixup!", "squash!", "Initial", "[pre-commit.ci]"]
